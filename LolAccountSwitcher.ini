[General]
; ------------------------------------------------------------------------------
; Language / Uygulama Dili
; ------------------------------------------------------------------------------
; [TR] Uygulamanın arayüz dilini belirler.
;      Seçenekler: tr (Türkçe), en (İngilizce)
;      Varsayılan Değer: tr
; [EN] Determines the UI language of the application.
;      Options: tr (Turkish), en (English)
;      Default Value: tr
Language=tr

; ------------------------------------------------------------------------------
; Theme / Görünüm Teması
; ------------------------------------------------------------------------------
; [TR] Uygulamanın renk temasını belirler.
;      Seçenekler:
;        - system (Windows işletim sistemi temasını otomatik algılar)
;        - dark   (Koyu Hextech temasını zorlar)
;        - light  (Açık Piltover gümüş temasını zorlar)
;      Varsayılan Değer: system
; [EN] Determines the visual color theme of the application.
;      Options:
;        - system (Automatically detects Windows OS theme)
;        - dark   (Forces Dark Hextech theme)
;        - light  (Forces Light Piltover silver theme)
;      Default Value: system
Theme=system

; ------------------------------------------------------------------------------
; AutoRefreshStats / Açılışta Otomatik Rank & Profil Güncelleme
; ------------------------------------------------------------------------------
; [TR] Uygulama her açıldığında kayıtlı hesapların rank ve avatar verilerini
;      arka planda sessizce otomatik yeniler.
;      Seçenekler: true (Açık), false (Kapalı)
;      Varsayılan Değer: true
; [EN] Automatically and silently updates ranked tier and profile pictures
;      in the background when the application launches.
;      Options: true (Enabled), false (Disabled)
;      Default Value: true
AutoRefreshStats=true

; ------------------------------------------------------------------------------
; CloseLeagueOnSwitch / Geçişte İstemci Kapatma
; ------------------------------------------------------------------------------
; [TR] Profil geçişi yapılırken arka planda açık olan LoL veya Riot Client
;      süreçlerini otomatik ve temiz şekilde kapatır.
;      Seçenekler: true (Açık), false (Kapalı)
;      Varsayılan Değer: true
; [EN] Automatically and cleanly closes open League of Legends or Riot Client
;      processes during profile switching.
;      Options: true (Enabled), false (Disabled)
;      Default Value: true
CloseLeagueOnSwitch=true
