; ==============================================================================
; Lol Account Switcher Configuration File / Yapılandırma Dosyası (v3.2)
; ==============================================================================
; Konum / Location: LolAccountSwitcher.exe ile aynı dizin / Same folder as .exe
; Yayıncı / Publisher: HaYTooL (https://haytokoraz.github.io/)
; Geliştirici / Developer: HaYTo (https://x.com/HaYTo)
; Web Sitesi / Website: https://haytokoraz.github.io/Lol-Account-Switcher/
; İletişim / Contact: korazhayto@gmail.com
; ==============================================================================

[General]
; ------------------------------------------------------------------------------
; Language / Uygulama Dili
; ------------------------------------------------------------------------------
; [TR] Uygulamanın arayüz dilini belirler.
;      Seçenekler: tr (Türkçe), en (İngilizce)
;      Varsayılan Değer: tr
; [EN] Determines the UI language of the application.
;      Options: tr (Turkish), en (English)
;      Default Value: tr
Language=tr

; ------------------------------------------------------------------------------
; Theme / Görünüm Teması
; ------------------------------------------------------------------------------
; [TR] Uygulamanın renk temasını belirler.
;      Seçenekler:
;        - system (Windows işletim sistemi temasını otomatik algılar)
;        - dark   (Koyu Hextech temasını zorlar)
;        - light  (Açık Piltover gümüş temasını zorlar)
;      Varsayılan Değer: system
; [EN] Determines the visual color theme of the application.
;      Options:
;        - system (Automatically detects Windows OS theme)
;        - dark   (Forces Dark Hextech theme)
;        - light  (Forces Light Piltover silver theme)
;      Default Value: system
Theme=system

; ------------------------------------------------------------------------------
; PlayStartupSound / Açılış Hoş Geldin Sesi
; ------------------------------------------------------------------------------
; [TR] Uygulama her açıldığında hoş geldin sesini çalar (%50 dengeli ses seviyesi).
;      Seçenekler: true (Açık), false (Kapalı)
;      Varsayılan Değer: true
; [EN] Plays welcome sound upon application startup.
;      Options: true (Enabled), false (Disabled)
;      Default Value: true
PlayStartupSound=true

; ------------------------------------------------------------------------------
; MinimizeToTray / Sistem Tepsisine (Saat Yanına) Küçültme
; ------------------------------------------------------------------------------
; [TR] Pencere kapatıldığında veya simge durumuna alındığında saat yanına küçültür.
;      Seçenekler: true (Açık), false (Kapalı)
;      Varsayılan Değer: true
; [EN] Minimizes/hides the window to system notification tray when closed or minimized.
;      Options: true (Enabled), false (Disabled)
;      Default Value: true
MinimizeToTray=true

; ------------------------------------------------------------------------------
; MaskEmailInUI / Arayüzde E-Postayı Sansürleme (*)
; ------------------------------------------------------------------------------
; [TR] Kartlar üzerindeki e-posta adreslerini sansürlü (*) olarak gösterir.
;      Seçenekler: true (Açık, örn: ko***z@gmail.com), false (Kapalı, tam adres)
;      Varsayılan Değer: true
; [EN] Displays email addresses on account cards masked with (*).
;      Options: true (Enabled, e.g. ko***z@gmail.com), false (Disabled, full address)
;      Default Value: true
MaskEmailInUI=true

; ------------------------------------------------------------------------------
; AutoRefreshStats / Açılışta Otomatik Rank & Profil Güncelleme
; ------------------------------------------------------------------------------
; [TR] Uygulama her açıldığında kayıtlı hesapların rank ve avatar verilerini
;      arka planda sessizce otomatik yeniler.
;      Seçenekler: true (Açık), false (Kapalı)
;      Varsayılan Değer: true
; [EN] Automatically and silently updates ranked tier and profile pictures
;      in the background when the application launches.
;      Options: true (Enabled), false (Disabled)
;      Default Value: true
AutoRefreshStats=true

; ------------------------------------------------------------------------------
; CloseLeagueOnSwitch / Geçişte İstemci Kapatma
; ------------------------------------------------------------------------------
; [TR] Profil geçişi yapılırken arka planda açık olan LoL veya Riot Client
;      süreçlerini otomatik ve temiz şekilde kapatır.
;      Seçenekler: true (Açık), false (Kapalı)
;      Varsayılan Değer: true
; [EN] Automatically and cleanly closes open League of Legends or Riot Client
;      processes during profile switching.
;      Options: true (Enabled), false (Disabled)
;      Default Value: true
CloseLeagueOnSwitch=true

; ------------------------------------------------------------------------------
; AutoLaunchGameOnSwitch / Hesap Geçişinde Oyunu Otomatik Başlatma
; ------------------------------------------------------------------------------
; [TR] Profil geçişi başarıyla tamamlandığında League of Legends veya Riot Client'ı
;      otomatik olarak başlatır.
;      Seçenekler: true (Açık), false (Kapalı)
;      Varsayılan Değer: true
; [EN] Automatically launches League of Legends or Riot Client after profile switch.
;      Options: true (Enabled), false (Disabled)
;      Default Value: true
AutoLaunchGameOnSwitch=true

; ------------------------------------------------------------------------------
; LaunchCompanionAppOnSwitch / Hesap Geçişinde Yardımcı Uygulama Başlatma
; ------------------------------------------------------------------------------
; [TR] Profil geçişi yapıldıktan sonra kurulu yardımcı uygulamayı otomatik başlatır
;      (Blitz.gg, Porofessor, Mobalytics, OP.GG, Zar.gg vb.).
;      Seçenekler: true (Açık), false (Kapalı)
;      Varsayılan Değer: false
; [EN] Automatically launches installed companion app after profile switch
;      (Blitz.gg, Porofessor, Mobalytics, OP.GG, Zar.gg, etc.).
;      Options: true (Enabled), false (Disabled)
;      Default Value: false
LaunchCompanionAppOnSwitch=false
LaunchBlitzOnSwitch=false

; ------------------------------------------------------------------------------
; CompanionAppPath / Yardımcı Uygulama (.exe) Dosya Yolu
; ------------------------------------------------------------------------------
; [TR] Yardımcı uygulamanın tam dosya yolu (Örn: C:\Users\...\Blitz.exe veya Porofessor.exe).
;      Boş bırakılırsa sistemden otomatik tespit edilir.
; [EN] Full path to companion app executable (e.g. Blitz.exe, Porofessor.exe, Mobalytics.exe).
CompanionAppPath=
BlitzPath=

; ------------------------------------------------------------------------------
; SwitchPowerPlanGuid / Hesap Değişiminde Aktif Edilecek Güç Planı GUID
; ------------------------------------------------------------------------------
; [TR] Hesap geçişi yapıldığında otomatik aktif edilecek Windows güç planı GUID'i.
;      Boş bırakılırsa varsayılan yüksek performans planı aranır.
; [EN] Windows power plan GUID activated automatically during account switch.
SwitchPowerPlanGuid=

; ------------------------------------------------------------------------------
; KillLeaguePowerPlanGuid / LoL Kapatıldığında Aktif Edilecek Güç Planı GUID
; ------------------------------------------------------------------------------
; [TR] 'LOL KAPAT' tıklandığında otomatik aktif edilecek Windows güç planı GUID'i.
;      Boş bırakılırsa dengeli / varsayılan plan uygulanır.
; [EN] Windows power plan GUID activated when 'KILL LEAGUE' is triggered.
KillLeaguePowerPlanGuid=

; ------------------------------------------------------------------------------
; SwitchRefreshRate / Hesap Değişiminde Monitör Tazeleme Hızı (Hz)
; ------------------------------------------------------------------------------
; [TR] Hesap geçişinde monitöre uygulanacak ekran yenileme hızı (Hz).
;      Örnekler: 60, 75, 120, 144, 165, 240, 360 veya 0 (değiştirme).
;      Varsayılan Değer: 0 (Değiştirme)
; [EN] Monitor refresh rate (Hz) to set when switching accounts.
;      Examples: 60, 75, 120, 144, 165, 240, 360 or 0 (keep unchanged).
;      Default Value: 0 (Keep unchanged)
SwitchRefreshRate=0

; ------------------------------------------------------------------------------
; KillLeagueRefreshRate / LoL Kapatıldığında Monitör Tazeleme Hızı (Hz)
; ------------------------------------------------------------------------------
; [TR] 'LOL KAPAT' tıklandığında monitöre uygulanacak ekran yenileme hızı (Hz).
;      Örnekler: 60, 75, 120, 144 veya 0 (değiştirme).
;      Varsayılan Değer: 0 (Değiştirme)
; [EN] Monitor refresh rate (Hz) to set when League is closed.
;      Examples: 60, 75, 120, 144 or 0 (keep unchanged).
;      Default Value: 0 (Keep unchanged)
KillLeagueRefreshRate=0

; ------------------------------------------------------------------------------
; RiotGamesPath / Riot Games Kurulum Klasörü
; ------------------------------------------------------------------------------
; [TR] Riot Games ana kurulum klasörü (Örn: D:\Riot Games).
;      Boş bırakılırsa sistemden otomatik tespit edilir.
; [EN] Main installation folder of Riot Games.
RiotGamesPath=

; ------------------------------------------------------------------------------
; RiotProfilePath / Riot İstemci & Profil Veri Klasörü
; ------------------------------------------------------------------------------
; [TR] Riot Client ve profil verilerinin saklandığı AppData klasörü (Örn: C:\Users\...\AppData\Local\Riot Games).
;      Boş bırakılırsa sistemden otomatik tespit edilir.
; [EN] Riot Client and profile data directory in AppData Local.
RiotProfilePath=

; ------------------------------------------------------------------------------
; ToolbarButtonsVisibility / Arayüz Buton & Rozet Görünürlüğü
; ------------------------------------------------------------------------------
; [TR] Ana ekran üst ve alt çubuklarındaki butonların görünürlüğünü belirler.
;      Değerler: true (Göster), false (Gizle)
; [EN] Controls visibility of buttons and badges on top and bottom toolbars.
;      Values: true (Show), false (Hide)
ShowHzBadge=true
ShowLangToggle=true
ShowThemeToggle=true
ShowRefreshStats=true
ShowWiki=true
ShowPatchNotes=true
ShowAppData=false

; ------------------------------------------------------------------------------
; CustomScripts / Özel Komut ve Harici Betik Çalıştırma (.exe, .bat, .cmd, .ps1)
; ------------------------------------------------------------------------------
; [TR] Hesap geçişi veya LoL Kapatma sırasında arka planda tetiklenecek harici komutlar.
;      Değişkenler: {TITLE}, {SUMMONER}, {SERVER}, {ID}
; [EN] External commands executed in background on profile switch or kill events.
;      Variables: {TITLE}, {SUMMONER}, {SERVER}, {ID}
PreSwitchCommand=
PostSwitchCommand=
KillLeagueCommand=

; ------------------------------------------------------------------------------
; ActiveAccount / Son Aktif Profil Kimliği (ID)
; ------------------------------------------------------------------------------
; [TR] En son geçiş yapılan ve şu an aktif olan hesabın benzersiz kimliği.
; [EN] Unique ID of the currently active / last switched account profile.
ActiveAccountId=
